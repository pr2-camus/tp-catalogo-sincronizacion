name: catalogo
services:
  postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - catalogo-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d catalogo']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  catalogo-db:
